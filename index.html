    <script>
      // Defensive shim: allow setting window.fetch in environments where it has only a getter
      (function() {
        try {
          var _f = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return _f; },
            set: function(v) { _f = v; }
          });
        } catch (_) {}
      })();
    </script>
